# lightning.pytorch==2.6.6
seed_everything: 2
trainer:
  accelerator: cpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 32
  logger: false
  callbacks: []
  fast_dev_run: false
  max_epochs: 100
  max_steps: -1
  overfit_batches: 0.0
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  enable_progress_bar: false
  accumulate_grad_batches: 1
  inference_mode: true
  use_distributed_sampler: true
  detect_anomaly: false
  barebones: false
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  enable_autolog_hparams: true
model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_args:
      backbone: prithvi_eo_v2_300
      necks:
      - name: SelectIndices
        indices:
        - 5
        - 11
        - 17
        - 23
      - name: ReshapeTokensToImage
      - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      num_classes: 2
      backbone_pretrained: true
      backbone_bands:
      - BLUE
      - GREEN
      - RED
      - NIR_NARROW
      - SWIR_1
      - SWIR_2
      decoder_channels:
      - 512
      - 256
      - 128
      - 64
    model_factory: EncoderDecoderFactory
    loss: ce
    ignore_index: -1
    lr: 0.0001
    optimizer: AdamW
    scheduler: ReduceLROnPlateau
    scheduler_hparams:
      patience: 4
      factor: 0.5
    freeze_backbone: false
    freeze_decoder: false
    freeze_head: false
    plot_on_val: false
    class_names:
    - Not burned
    - Burn scar
    output_on_inference: prediction
    output_most_probable: true
    tiled_inference_on_testing: false
    tiled_inference_on_validation: false
data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 4
    num_workers: 2
    num_classes: 2
    train_data_root: /home/meteorboyf/Paper/Burn/data/hls_burn_scars_flat
    val_data_root: /home/meteorboyf/Paper/Burn/data/hls_burn_scars_flat
    test_data_root: /home/meteorboyf/Paper/Burn/data/hls_burn_scars_flat
    img_grep: '*_merged.tif'
    label_grep: '*.mask.tif'
    means:
    - 0.033349706741586264
    - 0.05701185520536176
    - 0.05889748132001316
    - 0.2323245113436119
    - 0.1972854853760658
    - 0.11944914225186566
    stds:
    - 0.02269135568823774
    - 0.026807560223070237
    - 0.04004109844362779
    - 0.07791732423672691
    - 0.08708738838140137
    - 0.07241979477437814
    train_split: /tmp/tmpueaan6ph/val_smoke.txt
    val_split: /tmp/tmpueaan6ph/val_smoke.txt
    test_split: /tmp/tmpueaan6ph/val_smoke.txt
    ignore_split_file_extensions: true
    allow_substring_split_file: true
    dataset_bands:
    - BLUE
    - GREEN
    - RED
    - NIR_NARROW
    - SWIR_1
    - SWIR_2
    output_bands:
    - BLUE
    - GREEN
    - RED
    - NIR_NARROW
    - SWIR_1
    - SWIR_2
    constant_scale: 1.0
    rgb_indices:
    - 2
    - 1
    - 0
    train_transform:
    - class_path: albumentations.D4
      init_args:
        p: 1
    - class_path: ToTensorV2
    test_transform:
    - class_path: ToTensorV2
    expand_temporal_dimension: false
    reduce_zero_label: false
    no_data_replace: 0.0
    no_label_replace: -1
    embedding_input: false
    pca_step: 4
    drop_last: true
    pin_memory: false
    check_stackability: true
    return_georeference: false
out_dtype: int16
deploy_config_file: true
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.01
    amsgrad: false
    maximize: false
    capturable: false
    differentiable: false
lr_scheduler:
  class_path: lightning.pytorch.cli.ReduceLROnPlateau
  init_args:
    monitor: val/loss
    mode: min
    factor: 0.5
    patience: 4
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 0.0
    eps: 1.0e-08
ckpt_path: /home/meteorboyf/Paper/Burn/data/prithvi2_burnscars/Prithvi_EO_V2_300M_BurnScars.pt
verbose: true
