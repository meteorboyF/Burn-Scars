data:
  class_path: GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 4
    dataset_bands:
    - BLUE
    - GREEN
    - RED
    - NIR_NARROW
    - SWIR_1
    - SWIR_2
    img_grep: '*_merged.tif'
    label_grep: '*.mask.tif'
    means:
    - 0.033349706741586264
    - 0.05701185520536176
    - 0.05889748132001316
    - 0.2323245113436119
    - 0.1972854853760658
    - 0.11944914225186566
    no_data_replace: 0
    no_label_replace: -1
    num_classes: 2
    num_workers: 2
    output_bands:
    - BLUE
    - GREEN
    - RED
    - NIR_NARROW
    - SWIR_1
    - SWIR_2
    rgb_indices:
    - 2
    - 1
    - 0
    stds:
    - 0.02269135568823774
    - 0.026807560223070237
    - 0.04004109844362779
    - 0.07791732423672691
    - 0.08708738838140137
    - 0.07241979477437814
    test_data_root: /home/meteorboyf/Paper/Burn/data/hls_burn_scars_flat
    test_split: /tmp/tmpueaan6ph/val_smoke.txt
    test_transform:
    - class_path: ToTensorV2
    train_data_root: /home/meteorboyf/Paper/Burn/data/hls_burn_scars_flat
    train_split: /tmp/tmpueaan6ph/val_smoke.txt
    train_transform:
    - class_path: albumentations.D4
    - class_path: ToTensorV2
    val_data_root: /home/meteorboyf/Paper/Burn/data/hls_burn_scars_flat
    val_split: /tmp/tmpueaan6ph/val_smoke.txt
lr_scheduler:
  class_path: ReduceLROnPlateau
  init_args:
    factor: 0.5
    monitor: val/loss
    patience: 4
model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    class_names:
    - Not burned
    - Burn scar
    freeze_backbone: false
    ignore_index: -1
    loss: ce
    model_args:
      backbone: prithvi_eo_v2_300
      backbone_bands:
      - BLUE
      - GREEN
      - RED
      - NIR_NARROW
      - SWIR_1
      - SWIR_2
      backbone_pretrained: false
      decoder: UNetDecoder
      decoder_channels:
      - 512
      - 256
      - 128
      - 64
      necks:
      - indices:
        - 5
        - 11
        - 17
        - 23
        name: SelectIndices
      - name: ReshapeTokensToImage
      - name: LearnedInterpolateToPyramidal
      num_classes: 2
    model_factory: EncoderDecoderFactory
    plot_on_val: false
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
seed_everything: 2
trainer:
  accelerator: cpu
  callbacks: []
  enable_progress_bar: false
  log_every_n_steps: 1
  logger: false
  max_epochs: 100
  precision: '32'
